<!DOCTYPE html>
<html>
	<head>
		<title>404 • Moonwake</title>
		<link rel="icon" href="Images/moonwake-favicon.png" type="image/png" />
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>

		<header class="home-header">
			<h1>404</h1>
			<h2>LOCATION NOT FOUND</h2>
		</header>

		<main class="error-page">

			<article class="error-record">

				<div class="error-code">
					ERROR • 404
				</div>

				<h2>THIS PLACE DOESN'T EXIST</h2>

				<p>
					The path you followed could not be found.
				</p>

				<p>
					It may have moved, disappeared, or never existed
					in the first place.
				</p>

				<div class="error-note">

					<span>MOONWAKE SYSTEM</span>

					<p>
						REQUESTED LOCATION: UNKNOWN
						<br>
						STATUS: NOT FOUND
						</br>
					</p>

				</div>

			</article>

		</main>

		<a href="index.html">
			<button>RETURN TO MOONWAKE</button>
		</a>

	</body>
</html>
